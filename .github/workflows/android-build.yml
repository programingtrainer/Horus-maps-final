name: Android build

on:
  push:
    branches: [ main, feature/advanced-search-navigation ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare high-resolution continent boundaries
        run: |
          python3 -m pip install --disable-pip-version-check "shapely>=2.0,<3"
          python3 scripts/build_continent_boundaries.py

      - name: Validate Cloudflare Worker syntax
        run: node --check worker.js

      - name: Smoke-test Preview search APIs
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = "https://feature-advanced-search-navigation-horus-maps-final.horus-egypt-company.workers.dev";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let healthy = false;
          for (let attempt = 1; attempt <= 24; attempt++) {
            try {
              const response = await fetch(base + "/health", { signal: AbortSignal.timeout(10000) });
              if (response.ok) { healthy = true; break; }
            } catch {}
            await sleep(5000);
          }
          if (!healthy) throw new Error("Preview Worker did not become healthy within 120 seconds.");

          const flightValidationResponse = await fetch(base + "/v1/search/flights", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({})
          });
          const flightValidation = await flightValidationResponse.json();
          if (flightValidationResponse.status !== 400 || flightValidation.ok !== false) {
            throw new Error("Flight search validation contract failed: HTTP " + flightValidationResponse.status);
          }

          const bookingValidationResponse = await fetch(base + "/v1/search/flights/booking-links", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({})
          });
          const bookingValidation = await bookingValidationResponse.json();
          if (bookingValidationResponse.status !== 400 || bookingValidation.ok !== false) {
            throw new Error("Flight booking-link validation contract failed: HTTP " + bookingValidationResponse.status);
          }

          const reverseResponse = await fetch(base + "/v1/search/reverse?lat=24.7171757&lon=46.6858209", { signal: AbortSignal.timeout(20000) });
          const reverse = await reverseResponse.json();
          if (!reverseResponse.ok || !reverse.ok || reverse.countryCode !== "sa") {
            throw new Error("Reverse geocoding smoke test failed: HTTP " + reverseResponse.status + ", country=" + reverse.countryCode);
          }

          const geocodeResponse = await fetch(base + "/v1/search/geocode?q=Riyadh&lat=24.7171757&lon=46.6858209&lang=en", { signal: AbortSignal.timeout(25000) });
          const geocode = await geocodeResponse.json();
          if (!geocodeResponse.ok || !geocode.ok || !Array.isArray(geocode.features) || geocode.features.length === 0) {
            throw new Error("Geocoding smoke test failed: HTTP " + geocodeResponse.status + ", error=" + (geocode.error || "no features"));
          }

          const usaResponse = await fetch(base + "/v1/search/geocode?q=" + encodeURIComponent("أمريكا") + "&lang=en", { signal: AbortSignal.timeout(25000) });
          const usa = await usaResponse.json();
          const usaMatches = (usa.features || []).some(feature => {
            const p = feature.properties || {};
            return /united states|usa/i.test([p.name, p.country, p.display_name].filter(Boolean).join(" "));
          });
          if (!usaResponse.ok || !usa.ok || !usaMatches) {
            throw new Error("Country alias smoke test failed for أمريكا: HTTP " + usaResponse.status);
          }

          const localityResponse = await fetch(base + "/v1/search/geocode?q=" + encodeURIComponent("منية سندوب") + "&lang=ar,en", { signal: AbortSignal.timeout(25000) });
          const locality = await localityResponse.json();
          if (!localityResponse.ok || !locality.ok || !Array.isArray(locality.features) || locality.features.length === 0) {
            throw new Error("Small locality geocoding smoke test failed for منية سندوب.");
          }

          const typoCountryResponse = await fetch(base + "/v1/search/geocode?q=" + encodeURIComponent("United State") + "&lang=en", { signal: AbortSignal.timeout(25000) });
          const typoCountry = await typoCountryResponse.json();
          const typoCountryMatches = (typoCountry.features || []).some(feature => {
            const p = feature.properties || {};
            return /united states|usa/i.test([p.name, p.country, p.display_name].filter(Boolean).join(" "));
          });
          if (!typoCountryResponse.ok || !typoCountry.ok || !typoCountryMatches) {
            throw new Error("Typo-tolerant country search smoke test failed for United State.");
          }

          const placesResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "supermarket", query: "" }),
            signal: AbortSignal.timeout(40000)
          });
          const places = await placesResponse.json();
          if (!placesResponse.ok || !places.ok || !Array.isArray(places.results) || places.results.length === 0) {
            throw new Error("Nearby POI smoke test failed: HTTP " + placesResponse.status + ", error=" + (places.error || "no results"));
          }

          const pandaResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "supermarket", query: "Panda" }),
            signal: AbortSignal.timeout(40000)
          });
          const panda = await pandaResponse.json();
          if (!pandaResponse.ok || !panda.ok || !Array.isArray(panda.results) || panda.results.length === 0) {
            throw new Error("Panda supermarket smoke test failed: HTTP " + pandaResponse.status + ", error=" + (panda.error || "no results"));
          }

          const typoPandaResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "supermarket", query: "Pnda" }),
            signal: AbortSignal.timeout(40000)
          });
          const typoPanda = await typoPandaResponse.json();
          if (!typoPandaResponse.ok || !typoPanda.ok || !Array.isArray(typoPanda.results) || typoPanda.results.length === 0) {
            throw new Error("Typo-tolerant Panda search smoke test failed.");
          }

          const fuelResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "fuel", query: "" }),
            signal: AbortSignal.timeout(40000)
          });
          const fuel = await fuelResponse.json();
          if (!fuelResponse.ok || !fuel.ok || !Array.isArray(fuel.results) || fuel.results.length === 0) {
            throw new Error("Nearby fuel station smoke test failed: HTTP " + fuelResponse.status + ", error=" + (fuel.error || "no results"));
          }

          const hospitalResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "hospital", query: "" }),
            signal: AbortSignal.timeout(40000)
          });
          const hospitals = await hospitalResponse.json();
          if (!hospitalResponse.ok || !hospitals.ok || !Array.isArray(hospitals.results) || hospitals.results.length === 0) {
            throw new Error("Nearby hospital smoke test failed: HTTP " + hospitalResponse.status + ", error=" + (hospitals.error || "no results"));
          }

          const dohaHospitalResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "hospital", query: "الدوحة", rawQuery: "مستشفيات الدوحة" }),
            signal: AbortSignal.timeout(55000)
          });
          const dohaHospitals = await dohaHospitalResponse.json();
          if (!dohaHospitalResponse.ok || !dohaHospitals.ok || dohaHospitals.countryCode !== "qa" || dohaHospitals.searchScope !== "administrative-area" || !Array.isArray(dohaHospitals.results) || dohaHospitals.results.length === 0) {
            throw new Error("Doha administrative-area hospital search failed: HTTP " + dohaHospitalResponse.status + ", country=" + dohaHospitals.countryCode + ", scope=" + dohaHospitals.searchScope + ", results=" + (dohaHospitals.results || []).length);
          }

          const walmartGlobalResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "supermarket", query: "Walmart", rawQuery: "Walmart" }),
            signal: AbortSignal.timeout(55000)
          });
          const walmartGlobal = await walmartGlobalResponse.json();
          if (!walmartGlobalResponse.ok || !walmartGlobal.ok || walmartGlobal.searchScope !== "nearby+country+global" || !Array.isArray(walmartGlobal.results)) {
            throw new Error("Global fallback API contract smoke test failed: HTTP " + walmartGlobalResponse.status + ", scope=" + walmartGlobal.searchScope);
          }

          const egyptCarrefourResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "supermarket", query: "Carrefour Egypt" }),
            signal: AbortSignal.timeout(55000)
          });
          const egyptCarrefour = await egyptCarrefourResponse.json();
          if (!egyptCarrefourResponse.ok || !egyptCarrefour.ok || egyptCarrefour.countryCode !== "eg" || egyptCarrefour.searchScope !== "country") {
            throw new Error("Cross-country Carrefour Egypt smoke test failed: HTTP " + egyptCarrefourResponse.status + ", country=" + egyptCarrefour.countryCode + ", scope=" + egyptCarrefour.searchScope + ", error=" + (egyptCarrefour.error || "no country-scoped results"));
          }

          const arabicCarrefourResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "supermarket", query: "كارفور مصر", rawQuery: "كارفور مصر" }),
            signal: AbortSignal.timeout(55000)
          });
          const arabicCarrefour = await arabicCarrefourResponse.json();
          if (!arabicCarrefourResponse.ok || !arabicCarrefour.ok || arabicCarrefour.countryCode !== "eg" || arabicCarrefour.searchScope !== "country") {
            throw new Error("Arabic cross-country Carrefour search failed: HTTP " + arabicCarrefourResponse.status + ", country=" + arabicCarrefour.countryCode + ", scope=" + arabicCarrefour.searchScope);
          }

          const egyptPharmacyResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "pharmacy", query: "مصر", rawQuery: "صيدلية في مصر" }),
            signal: AbortSignal.timeout(55000)
          });
          const egyptPharmacies = await egyptPharmacyResponse.json();

          if (!egyptPharmacyResponse.ok || !egyptPharmacies.ok || egyptPharmacies.countryCode !== "eg" || egyptPharmacies.searchScope !== "country" || !Array.isArray(egyptPharmacies.results) || egyptPharmacies.results.length === 0) {
            throw new Error("Category-only cross-country pharmacy search failed: HTTP " + egyptPharmacyResponse.status + ", country=" + egyptPharmacies.countryCode + ", scope=" + egyptPharmacies.searchScope);
          }

          const pharmacyResponse = await fetch(base + "/v1/search/places", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({ latitude: 24.7171757, longitude: 46.6858209, countryCode: "SA", category: "pharmacy", query: "" }),
            signal: AbortSignal.timeout(40000)
          });
          const pharmacies = await pharmacyResponse.json();
          if (!pharmacyResponse.ok || !pharmacies.ok || !Array.isArray(pharmacies.results) || pharmacies.results.length === 0) {
            throw new Error("Nearby pharmacy smoke test failed: HTTP " + pharmacyResponse.status + ", error=" + (pharmacies.error || "no results"));
          }

          console.log("Preview search smoke tests passed:", JSON.stringify({
            reverseCountry: reverse.countryCode,
            geocodeResults: geocode.features.length,
            usaAliasResults: usa.features.length,
            typoCountryResults: typoCountry.features.length,
            nearbySupermarkets: places.results.length,
            pandaMatches: panda.results.length,
            typoPandaMatches: typoPanda.results.length,
            nearbyFuelStations: fuel.results.length,
            nearbyHospitals: hospitals.results.length,
            egyptCarrefourBranches: egyptCarrefour.results.length,
            arabicEgyptCarrefourBranches: arabicCarrefour.results.length,
            egyptPharmacies: egyptPharmacies.results.length,
            egyptSearchScope: egyptCarrefour.searchScope,
            walmartGlobalFallbackResults: walmartGlobal.results.length,
            nearbyPharmacies: pharmacies.results.length
          }));
          NODE

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HorusMaps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
